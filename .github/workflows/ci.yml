name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cuda-build:
    name: Linux CUDA Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Neuro (CUDA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cpu-tests:
    name: Linux CPU Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test Neuro (CPU)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          push: false
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,scope=cpu,mode=max